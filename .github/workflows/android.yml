name: Android CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

jobs:
  build-debug:
    name: Build PyCode Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Clone submodules (extra safety)
        run: git submodule update --init --recursive

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Debug APK
        run: ./gradlew assembleCommunityDebug --no-daemon

      - name: List built APKs
        run: find app/build/outputs -name "*.apk" -exec ls -l {} \;

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: PyCode-debug
          path: app/build/outputs/apk/community/debug/*.apk
